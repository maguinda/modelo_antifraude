# Pruebas y calidad en cada push. Corre con las MISMAS versiones que se despliegan (requirements-dev.txt incluye requirements-produccion.txt).
# El repositorio es público: el flujo no usa secretos, tiene permisos de solo lectura y las acciones están fijadas por su huella (SHA), no por etiqueta.
name: Pruebas y calidad

on:
  push:
  workflow_dispatch:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04              # fijo, no «latest»: en ubuntu-latest (26.04) ya no existe Python 3.9, y así la CI no cambia de sistema sin avisar
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]      # 3.9 es el de tu equipo hoy; 3.12 es el de producción. Cuando migres, se quita la 3.9.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: modelo_ia            # el paquete se llama modelo_ia: las pruebas lo importan por ese nombre
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: modelo_ia/requirements-dev.txt
      - name: Instalar dependencias (versiones exactas)
        run: python -m pip install -r modelo_ia/requirements-dev.txt
      - name: Pruebas
        run: python -m pytest modelo_ia/tests -q -p no:cacheprovider

  postgres:
    name: Pruebas sobre PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:                       # una base de PostgreSQL REAL (la misma versión que se prueba en local); la contraseña es solo de esta máquina efímera
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: prueba_ci
          POSTGRES_DB: antifraude
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8   # colación C: el orden de los textos es el mismo que en SQLite
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: modelo_ia
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modelo_ia/requirements-dev.txt
      - name: Instalar dependencias (versiones exactas)
        run: python -m pip install -r modelo_ia/requirements-dev.txt
      - name: Pruebas contra PostgreSQL (las que abren el archivo de SQLite o hacen copias cifradas se saltan solas)
        env:
          MODELO_IA_PRUEBAS_PG: postgresql://postgres:prueba_ci@localhost:5432/antifraude
        run: python -m pytest modelo_ia/tests -q -p no:cacheprovider

  calidad:
    name: Calidad (ruff, tipos y archivos pesados)
    runs-on: ubuntu-24.04              # fijo, no «latest»: en ubuntu-latest (26.04) ya no existe Python 3.9, y así la CI no cambia de sistema sin avisar
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: modelo_ia
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modelo_ia/requirements-dev.txt
      - name: Instalar dependencias (versiones exactas)
        run: python -m pip install -r modelo_ia/requirements-dev.txt
      - name: Errores reales de código (ruff)
        run: ruff check modelo_ia
      - name: Formato del código (ruff format, ancho 120)
        if: ${{ !cancelled() }}
        run: ruff format --check modelo_ia
      - name: Tipos en api/ (mypy)
        if: ${{ !cancelled() }}              # cada revisión corre aunque otra haya fallado: se ven todos los problemas de una vez
        working-directory: modelo_ia
        run: mypy
      - name: Ningún archivo versionado de más de 5 MB
        if: ${{ !cancelled() }}
        working-directory: modelo_ia
        run: |
          grandes=$(git ls-files -z | xargs -0 du -k | awk '$1 > 5120 {print "  " $2 " (" $1 " KB)"}')
          if [ -n "$grandes" ]; then
            echo "Hay archivos versionados de más de 5 MB (¿datos pesados o personales subidos por error?):"
            echo "$grandes"
            exit 1
          fi
          echo "Ningún archivo versionado supera los 5 MB."
